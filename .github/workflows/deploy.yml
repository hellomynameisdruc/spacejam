# Builds the site and deploys it to GitHub Pages. Map data comes from the `data` branch
# (overwritten on every refresh, so history stays small); without it the test map is used.
name: Викласти сайт

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Зібрати мапу з Discogs"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the real map data if the data branch exists
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            rm -rf web/public/data && mkdir -p web/public/data
            git --work-tree=web/public/data checkout FETCH_HEAD -- .
            echo "Real map: $(du -sh web/public/data | cut -f1)"
          elif gh release download data-latest -p map-data.tar.gz -D /tmp 2>/dev/null; then
            rm -rf web/public/data && tar -xzf /tmp/map-data.tar.gz -C web/public
          else
            echo "No real data yet — deploying the test map."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
