<!doctype html>
<html lang="en" data-phosphor="violet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sound Cosmos</title>
  <meta name="description" content="An observatory terminal for house music: styles are stars, labels are planets, tracks are satellites.">
</head>
<body>
  <div class="term">
    <header class="bar">
      <div class="brand"><span class="inv">SOUND COSMOS</span><span class="sub">OBSERVATORY // SECTOR <b id="sector">HOUSE</b></span></div>
      <div class="ticker" aria-hidden="true"><div class="ticker-in" id="ticker"></div></div>
      <div class="sys">
        <div class="phos" role="group" aria-label="Phosphor colour">
          <button type="button" data-ph="violet" aria-label="Violet phosphor"></button>
          <button type="button" data-ph="green" aria-label="Green phosphor"></button>
          <button type="button" data-ph="amber" aria-label="Amber phosphor"></button>
        </div>
        <span class="clock" id="clock">00:00:00</span>
        <span class="batt" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </header>

    <main class="deck">
      <section class="panel scope" aria-label="Scanner">
        <div class="ph-head"><span>SCANNER<span class="long"> // STAR MAP</span></span><span id="scaleName">GALAXY</span></div>
        <div class="viewport" id="viewport">
          <canvas id="sky" aria-label="Map of styles, labels and tracks"></canvas>
          <div class="banner" id="sampleBanner" hidden>
            <b>TEST SIGNAL</b> names are made up and videos won't play. The real map appears once the Discogs dump is processed. <u>hide</u>
          </div>
        </div>
        <div class="ph-foot">
          <span class="readout" id="readout">X +0000.0 Y +0000.0 ×0.00</span>
          <div class="ctrl">
            <button type="button" class="key hot" id="warp"><kbd>W</kbd>WORMHOLE</button>
            <button type="button" class="key" id="home"><kbd>H</kbd>FULL SECTOR</button>
            <button type="button" class="key sq" id="zin" aria-label="Zoom in">+</button>
            <button type="button" class="key sq" id="zout" aria-label="Zoom out">−</button>
          </div>
        </div>
      </section>

      <aside class="panel dossier" aria-label="Dossier">
        <div class="ph-head"><span id="dosId">DOSSIER // SECTOR</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
        <div class="player" id="playerBox" hidden>
          <!-- YouTube's rules: the player stays visible (≥200px), nothing is drawn over it -->
          <div class="video" id="videoWrap"><div id="yt"></div></div>
          <div class="np"><span class="np-k">NOW PLAYING</span><span class="np-t" id="npTitle">—</span></div>
          <div class="seek">
            <span class="tc" id="tCur">0:00</span>
            <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <span class="tc" id="tDur">0:00</span>
          </div>
          <div class="pbar">
            <button type="button" class="key sq" id="pPrev" aria-label="Previous">◂◂</button>
            <button type="button" class="key sq hot" id="pToggle" aria-label="Pause">❚❚</button>
            <button type="button" class="key sq" id="pNext" aria-label="Next nearby">▸▸</button>
            <label class="vol"><span>VOL</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></label>
            <label class="tog"><input id="autopilot" type="checkbox" checked><span>AUTOPILOT</span></label>
          </div>
          <p class="pmsg" id="pMsg" hidden></p>
        </div>
        <div class="dbody" id="detail"></div>
        <div class="log">
          <div class="ph-sub">FLIGHT LOG</div>
          <div class="loglines" id="log"></div>
        </div>
      </aside>
    </main>

    <footer class="cmd">
      <label class="prompt" for="q">&gt;</label>
      <div class="cmdfield">
        <input id="q" type="search" placeholder="search: style, label or artist" autocomplete="off" spellcheck="false">
        <div class="results" id="results" hidden></div>
      </div>
      <div class="hints" aria-hidden="true"><kbd>/</kbd>SEARCH <kbd>␣</kbd>PAUSE <kbd>N</kbd>NEXT <kbd>ESC</kbd>BACK</div>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
